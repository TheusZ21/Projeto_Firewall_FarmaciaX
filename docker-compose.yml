
services:
  firewall:
    build: ./FireWall
    container_name: farmacia_firewall
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      rede_cliente:
        ipv4_address: 10.90.10.1
      rede_dmz:
        ipv4_address: 10.90.20.1
      rede_dados:
        ipv4_address: 10.90.30.1
    restart: unless-stopped

  cliente:
    build: ./Cliente
    container_name: farmacia_cliente
    cap_add:
      - NET_ADMIN
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ip route replace 10.90.20.0/24 via 10.90.10.1 && ip route replace 10.90.30.0/24 via 10.90.10.1 && echo 'Cliente da Farmacia X pronto.' && tail -f /dev/null"
    networks:
      rede_cliente:
        ipv4_address: 10.90.10.10
    depends_on:
      - firewall
    restart: unless-stopped

  web:
    build: ./Web
    container_name: farmacia_web
    ports:
      - "8080:80"
    cap_add:
      - NET_ADMIN
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ip route replace 10.90.10.0/24 via 10.90.20.1 && ip route replace 10.90.30.0/24 via 10.90.20.1 && exec nginx -g 'daemon off;'"
    networks:
      rede_dmz:
        ipv4_address: 10.90.20.10
    depends_on:
      - firewall
    restart: unless-stopped

  banco:
    build: ./Banco
    container_name: farmacia_banco
    cap_add:
      - NET_ADMIN
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ip route replace 10.90.10.0/24 via 10.90.30.1 && ip route replace 10.90.20.0/24 via 10.90.30.1 && exec docker-entrypoint.sh postgres"
    networks:
      rede_dados:
        ipv4_address: 10.90.30.10
    depends_on:
      - firewall
    restart: unless-stopped

networks:
  rede_cliente:
    driver: bridge
    ipam:
      config:
        - subnet: 10.90.10.0/24
          gateway: 10.90.10.254

  rede_dmz:
    driver: bridge
    ipam:
      config:
        - subnet: 10.90.20.0/24
          gateway: 10.90.20.254

  rede_dados:
    driver: bridge
    ipam:
      config:
        - subnet: 10.90.30.0/24
          gateway: 10.90.30.254
